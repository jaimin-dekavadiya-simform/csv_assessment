<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSV-Explorer</title>
    <script src="./src/main.js" type="module" defer></script>
    <link rel="stylesheet" href="./styles/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header></header>
    <main>
      <div class="loading-icon"><span class="loader"></span></div>
      <div class="file-loader">
        <input
          class="file-input"
          type="file"
          name="csv-file"
          id="csv-file"
          accept=".csv"
        />
        <button class="submit-btn" type="submit">Upload</button>
      </div>
      <div class="data-container">
        <div class="data-options">
          <input type="search" class="search-input" />
          <select name="page-offset" id="page-offset" class="page-offset">
            <option value="10">10</option>
            <option value="25">25</option>
            <option value="50" selected>50</option>
            <option value="100">100</option>
            <option value="200">200</option>
          </select>

          <button class="prev-page-btn">Previous</button>

          <button class="next-page-btn">Next</button>

          <div class="page-numbers"></div>
        </div>
        <i class="fa-thin fa-sort-down"></i>
        <table class="data-table"></table>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
