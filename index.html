<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSV-Explorer</title>
    <script src="./src/main.js" type="module" defer></script>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <header></header>
    <main>
      <div class="loading-icon"><span class="loader"></span></div>
      <div class="file-loader">
        <input
          class="file-input"
          type="file"
          name="csv-file"
          id="csv-file"
          accept=".csv"
        />
        <button class="submit-btn" type="submit">Upload</button>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
